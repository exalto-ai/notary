[package]
name = "notary-app"
version = "0.1.4"
description = "Guided desktop shell for Notary by Exalto"
edition = "2024"
license = "MIT OR Apache-2.0"

[lib]
name = "notary_app"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
notary-core = { path = "../../../runtime/crates/notary-core", features = ["cli"] }
notary-updater = { path = "../../../runtime/crates/notary-updater" }
notaryctl = { path = "../../../runtime/crates/notaryctl" }
keyring = { version = "3.6", features = [
    "apple-native",
    "windows-native",
    "linux-native-sync-persistent",
    "crypto-rust",
    "vendored",
] }
hex = "0.4"
rand = "0.9"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["image-png", "tray-icon"] }
tauri-plugin-autostart = "2"
tauri-plugin-shell = "2"
tauri-plugin-updater = "2.9"
tokio = { version = "1", features = ["time"] }
url = "2.5"
zeroize = "1.8"

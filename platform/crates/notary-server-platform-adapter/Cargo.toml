[package]
name = "notary-server-platform-adapter"
version = "0.1.0"
edition = "2024"
publish = false
description = "Private platform admission and settlement adapter for Notary server"

[[bin]]
name = "notary-server"
path = "src/bin/notary-server.rs"

[dependencies]
anyhow = { workspace = true }
async-trait = "0.1"
hex = { workspace = true }
notary-core = { workspace = true }
notary-server = { path = "../../../runtime/crates/notary-server" }
metrics = { workspace = true }
reqwest = { workspace = true, features = ["json", "rustls-tls"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["full"] }
tracing = { workspace = true }
url = { workspace = true }

[dev-dependencies]
axum = { workspace = true }
notary-server = { path = "../../../runtime/crates/notary-server", features = ["test-support"] }
tempfile = "3.20"

name: S3 storage canary

on:
  workflow_dispatch:
  schedule:
    - cron: "41 15 * * 3"

permissions:
  contents: read

concurrency:
  group: s3-storage-canary
  cancel-in-progress: false

jobs:
  round-trip:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      NOTARY_API_S3_ACCESS_KEY_ID: ${{ secrets.NOTARY_CANARY_S3_ACCESS_KEY_ID }}
      NOTARY_API_S3_SECRET_ACCESS_KEY: ${{ secrets.NOTARY_CANARY_S3_SECRET_ACCESS_KEY }}
      NOTARY_API_S3_BUCKET: ${{ vars.NOTARY_CANARY_S3_BUCKET }}
      NOTARY_API_S3_ENDPOINT: ${{ vars.NOTARY_CANARY_S3_ENDPOINT }}
      NOTARY_API_S3_REGION: ${{ vars.NOTARY_CANARY_S3_REGION }}
      NOTARY_API_S3_PREFIX: notary-api-canary
      NOTARY_API_S3_FORCE_PATH_STYLE: "true"
    steps:
      - id: configuration
        name: Check dedicated canary configuration
        run: |
          set -euo pipefail
          configured=true
          for name in \
            NOTARY_API_S3_ACCESS_KEY_ID NOTARY_API_S3_SECRET_ACCESS_KEY \
            NOTARY_API_S3_BUCKET NOTARY_API_S3_ENDPOINT NOTARY_API_S3_REGION; do
            if test -z "${!name}"; then configured=false; fi
          done
          echo "configured=$configured" >> "$GITHUB_OUTPUT"
          if test "$configured" != true; then
            echo "::notice::Dedicated S3 canary credentials are not configured; scheduled check skipped."
          fi
      - name: Require configuration for manual runs
        if: steps.configuration.outputs.configured != 'true' && github.event_name == 'workflow_dispatch'
        run: |
          echo "Dedicated NOTARY_CANARY_S3_* secrets and variables are required." >&2
          exit 1
      - uses: actions/checkout@v6
        if: steps.configuration.outputs.configured == 'true'
      - uses: dtolnay/rust-toolchain@master
        if: steps.configuration.outputs.configured == 'true'
        with:
          toolchain: 1.95.0
      - uses: Swatinem/rust-cache@v2
        if: steps.configuration.outputs.configured == 'true'
      - name: Exercise presigned upload, promotion, metadata, and cleanup
        if: steps.configuration.outputs.configured == 'true'
        run: >-
          cargo test -p notary-api
          live_s3_presigned_upload_and_promotion_round_trip
          -- --ignored --nocapture

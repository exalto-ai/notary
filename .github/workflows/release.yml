name: Release Runtime

on:
  workflow_dispatch:
    inputs:
      version:
        description: Next stable Runtime version (X.Y.Z)
        required: true
        type: string

permissions:
  actions: read
  contents: read

env:
  RELEASE_GIT_NAME: exalto-ai
  RELEASE_GIT_EMAIL: k@exalto.ai

concurrency:
  group: stable-runtime-release
  cancel-in-progress: false

jobs:
  config:
    name: Validate release origin
    runs-on: ubuntu-24.04
    env:
      PUBLIC_ORIGIN: ${{ vars.NOTARY_PUBLIC_ORIGIN || 'https://notary.exalto.ai' }}
    steps:
      - name: Verify the compiled public origin
        run: |
          set -euo pipefail
          node -e '
            const origin = new URL(process.env.PUBLIC_ORIGIN);
            if (origin.protocol !== "https:" || origin.pathname !== "/" || origin.search || origin.hash) {
              throw new Error("NOTARY_PUBLIC_ORIGIN must be an HTTPS origin");
            }
          '
          curl --fail --silent --show-error --location \
            --retry 3 --retry-all-errors --connect-timeout 5 --max-time 20 \
            "$PUBLIC_ORIGIN/" >/dev/null

  commit:
    name: Create release commit
    needs: config
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      release_sha: ${{ steps.commit.outputs.release_sha }}
      version: ${{ steps.commit.outputs.version }}
    env:
      GH_TOKEN: ${{ secrets.NOTARY_RELEASE_TOKEN }}
      VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          token: ${{ secrets.NOTARY_RELEASE_TOKEN }}
      - name: Validate release request
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = workflow_dispatch
          test "$GITHUB_REF" = refs/heads/main
          test -n "$GH_TOKEN"
          source_sha="$(git rev-parse HEAD)"
          test "$source_sha" = "$GITHUB_SHA"
          main_sha="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)"
          test "$source_sha" = "$main_sha"
          node scripts/runtime-version.mjs --require-next "$VERSION"
          .github/scripts/require-main-validation.sh "$source_sha"

          for pair in \
            "$GITHUB_REPOSITORY refs/tags/runtime/v$VERSION" \
            "exalto-ai/notary-runtime refs/tags/v$VERSION"; do
            read -r repository qualified_name <<<"$pair"
            ref="$(gh api graphql \
              -f owner="${repository%%/*}" \
              -f name="${repository#*/}" \
              -f qualifiedName="$qualified_name" \
              -f query='query($owner:String!,$name:String!,$qualifiedName:String!){repository(owner:$owner,name:$name){ref(qualifiedName:$qualifiedName){name}}}' \
              --jq .data.repository.ref.name)"
            if test -n "$ref"; then
              echo "$qualified_name already exists in $repository" >&2
              exit 1
            fi
          done
      - name: Commit synchronized release metadata
        id: commit
        run: |
          set -euo pipefail
          node scripts/runtime-version.mjs --set "$VERSION"
          node scripts/runtime-version.mjs --check "$VERSION"
          expected="$(printf '%s\n' \
            Cargo.lock \
            apps/notary-app/package-lock.json \
            apps/notary-app/package.json \
            apps/notary-app/src-tauri/Cargo.toml \
            apps/notary-app/src-tauri/tauri.conf.json \
            runtime/Cargo.lock \
            runtime/Cargo.toml | sort)"
          actual="$(git diff --name-only | sort)"
          if test "$actual" != "$expected"; then
            echo "release version synchronization changed an unexpected file set" >&2
            diff -u <(printf '%s\n' "$expected") <(printf '%s\n' "$actual") || true
            exit 1
          fi
          git config user.name "$RELEASE_GIT_NAME"
          git config user.email "$RELEASE_GIT_EMAIL"
          git add -- \
            Cargo.lock \
            apps/notary-app/package-lock.json \
            apps/notary-app/package.json \
            apps/notary-app/src-tauri/Cargo.toml \
            apps/notary-app/src-tauri/tauri.conf.json \
            runtime/Cargo.lock \
            runtime/Cargo.toml
          git commit -m "Release Runtime v$VERSION (#364)"
          release_sha="$(git rev-parse HEAD)"
          expected_identity="$(printf '%s <%s>\n%s <%s>' \
            "$RELEASE_GIT_NAME" "$RELEASE_GIT_EMAIL" \
            "$RELEASE_GIT_NAME" "$RELEASE_GIT_EMAIL")"
          actual_identity="$(git show --no-patch --format='%an <%ae>%n%cn <%ce>' "$release_sha")"
          if test "$actual_identity" != "$expected_identity"; then
            echo "release commit author or committer identity is incorrect" >&2
            exit 1
          fi
          git push origin HEAD:main
          {
            echo "release_sha=$release_sha"
            echo "version=$VERSION"
          } >> "$GITHUB_OUTPUT"

  prepare:
    name: Validate and tag release sources
    needs: commit
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    outputs:
      build_id: ${{ steps.release.outputs.build_id }}
      private_tag: ${{ steps.release.outputs.private_tag }}
      public_sha: ${{ steps.release.outputs.public_sha }}
      public_tag: ${{ steps.release.outputs.public_tag }}
      release_sha: ${{ steps.release.outputs.release_sha }}
      version: ${{ steps.release.outputs.version }}
    env:
      GH_TOKEN: ${{ secrets.NOTARY_RELEASE_TOKEN }}
      RELEASE_SHA: ${{ needs.commit.outputs.release_sha }}
      VERSION: ${{ needs.commit.outputs.version }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.commit.outputs.release_sha }}
          fetch-depth: 0
          token: ${{ secrets.NOTARY_RELEASE_TOKEN }}
      - name: Require exact release-commit validation
        run: |
          set -euo pipefail
          for attempt in $(seq 1 240); do
            if .github/scripts/require-main-validation.sh "$RELEASE_SHA"; then
              exit 0
            fi
            echo "waiting for Main validation of $RELEASE_SHA ($attempt/240)"
            sleep 30
          done
          echo "Main validation did not succeed for $RELEASE_SHA" >&2
          exit 1
      - name: Resolve public export and tag exact sources
        id: release
        run: |
          set -euo pipefail
          private_tag="runtime/v$VERSION"
          public_tag="v$VERSION"

          public_sha=""
          for attempt in $(seq 1 420); do
            api_error="$RUNNER_TEMP/public-runtime-api-error"
            if ! commits="$(gh api --method GET repos/exalto-ai/notary-runtime/commits \
              -f per_page=100 2>"$api_error")"; then
              echo "public Runtime commit query failed: $(<"$api_error")" >&2
              commits='[]'
            fi
            public_sha="$(jq -r --arg message "Export Runtime from $RELEASE_SHA" \
              'if type == "array" then
                first(.[] | select(.commit.message == $message) | .sha) // empty
              else empty end' <<<"$commits" 2>/dev/null || true)"
            if test -n "$public_sha"; then
              if ! encoded_mapping="$(gh api \
                "repos/exalto-ai/notary-runtime/contents/.notary-source.json?ref=$public_sha" \
                --jq .content 2>"$api_error")"; then
                echo "public Runtime source mapping query failed: $(<"$api_error")" >&2
                public_sha=""
                echo "waiting to read public Runtime source mapping ($attempt/420)"
                sleep 30
                continue
              fi
              if ! mapping="$(tr -d '\n' <<<"$encoded_mapping" | base64 --decode)" \
                  || ! jq -e --arg sha "$RELEASE_SHA" '
                    .schema_version == "notary/source-export/v1" and
                    .canonical_source_sha == $sha
                  ' <<<"$mapping" >/dev/null; then
                echo "the public export has an invalid source mapping" >&2
                exit 1
              fi
              break
            fi
            echo "waiting for public Runtime export of $RELEASE_SHA ($attempt/420)"
            sleep 30
          done
          if test -z "$public_sha"; then
            echo "the exact release commit was not exported to the public Runtime" >&2
            exit 1
          fi
          main_sha="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)"
          if test "$main_sha" != "$RELEASE_SHA"; then
            echo "main advanced to $main_sha before release source tagging" >&2
            exit 1
          fi

          resolve_tag_commit() {
            local repository="$1"
            local tag="$2"
            local reference object_type object_sha
            if ! reference="$(gh api "repos/$repository/git/ref/tags/$tag" 2>/dev/null)"; then
              return 1
            fi
            object_type="$(jq -r .object.type <<<"$reference")"
            object_sha="$(jq -r .object.sha <<<"$reference")"
            if test "$object_type" = tag; then
              gh api "repos/$repository/git/tags/$object_sha" --jq .object.sha
            elif test "$object_type" = commit; then
              printf '%s\n' "$object_sha"
            else
              echo "tag $tag in $repository has unsupported target type $object_type" >&2
              return 2
            fi
          }

          existing_private="$(resolve_tag_commit "$GITHUB_REPOSITORY" "$private_tag" || true)"
          if test -n "$existing_private"; then
            test "$existing_private" = "$RELEASE_SHA" || {
              echo "$private_tag points to $existing_private instead of $RELEASE_SHA" >&2
              exit 1
            }
          else
            git -c user.name="$RELEASE_GIT_NAME" \
              -c user.email="$RELEASE_GIT_EMAIL" \
              tag --annotate "$private_tag" "$RELEASE_SHA" \
              --message "Notary Runtime v$VERSION"
            tagger_identity="$(git for-each-ref \
              --format='%(taggername) %(taggeremail)' "refs/tags/$private_tag")"
            expected_tagger="$RELEASE_GIT_NAME <$RELEASE_GIT_EMAIL>"
            if test "$tagger_identity" != "$expected_tagger"; then
              echo "$private_tag tagger identity is incorrect" >&2
              exit 1
            fi
            git push origin "refs/tags/$private_tag"
          fi

          existing_public="$(resolve_tag_commit exalto-ai/notary-runtime "$public_tag" || true)"
          if test -n "$existing_public"; then
            test "$existing_public" = "$public_sha" || {
              echo "$public_tag points to $existing_public instead of $public_sha" >&2
              exit 1
            }
          else
            gh api --method POST repos/exalto-ai/notary-runtime/git/refs \
              -f ref="refs/tags/$public_tag" -f sha="$public_sha" >/dev/null
          fi
          build_id="runtime-v$VERSION-$RELEASE_SHA-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          {
            echo "build_id=$build_id"
            echo "private_tag=$private_tag"
            echo "public_sha=$public_sha"
            echo "public_tag=$public_tag"
            echo "release_sha=$RELEASE_SHA"
            echo "version=$VERSION"
          } >> "$GITHUB_OUTPUT"
          {
            echo "### Runtime v$VERSION prepared"
            echo
            echo "- Private: \`$private_tag\` at \`$RELEASE_SHA\`"
            echo "- Public: \`$public_tag\` at \`$public_sha\`"
            echo "- Build: \`$build_id\`"
          } >> "$GITHUB_STEP_SUMMARY"

  build:
    name: ${{ matrix.asset }}
    needs: prepare
    timeout-minutes: 90
    env:
      NOTARY_PUBLIC_ORIGIN: ${{ vars.NOTARY_PUBLIC_ORIGIN || 'https://notary.exalto.ai' }}
      NOTARY_BUILD_ID: ${{ needs.prepare.outputs.build_id }}
      NOTARY_UPDATES_ENABLED: 1
      RELEASE_SHA: ${{ needs.prepare.outputs.release_sha }}
      VERSION: ${{ needs.prepare.outputs.version }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            asset: linux-x86_64
            archive: tar.gz
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            asset: linux-aarch64
            archive: tar.gz
          - runner: macos-14
            target: aarch64-apple-darwin
            asset: darwin-aarch64
            archive: tar.gz
          - runner: windows-2025
            target: x86_64-pc-windows-msvc
            asset: windows-x86_64
            archive: zip
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare.outputs.private_tag }}
      - name: Verify release source
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
          node scripts/runtime-version.mjs --check "$VERSION"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.95.0
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: cli-${{ matrix.target }}
      - name: Build release binaries
        run: cargo build --manifest-path runtime/Cargo.toml --target-dir target --locked --release --target ${{ matrix.target }} -p notaryctl --bin notaryctl -p notaryd --bin notaryd
      - name: Exercise Windows trust-store replacement
        if: runner.os == 'Windows'
        run: cargo test --manifest-path runtime/Cargo.toml --target-dir target --locked --release --target ${{ matrix.target }} -p notaryd service::registry::tests::write_store_atomically_replaces_an_existing_file
      - name: Package archive
        shell: bash
        env:
          ASSET: ${{ matrix.asset }}
          ARCHIVE: ${{ matrix.archive }}
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          folder="notary-runtime-${VERSION}-${ASSET}"
          mkdir "$folder"
          suffix=""
          if [[ "$TARGET" == *windows* ]]; then suffix=".exe"; fi
          cp "target/$TARGET/release/notaryctl${suffix}" "$folder/"
          cp "target/$TARGET/release/notaryd${suffix}" "$folder/"
          "target/$TARGET/release/notaryctl${suffix}" --version | grep -F "$NOTARY_BUILD_ID" >/dev/null
          "target/$TARGET/release/notaryd${suffix}" --version | grep -F "$NOTARY_BUILD_ID" >/dev/null
          cp runtime/LICENSE-APACHE runtime/LICENSE-MIT runtime/THIRD-PARTY-NOTICES.md "$folder/"
          if [[ "$ARCHIVE" == "zip" ]]; then
            archive="${folder}.zip"
            7z a "$archive" "$folder" >/dev/null
          else
            archive="${folder}.tar.gz"
            tar -czf "$archive" "$folder"
          fi
          if command -v sha256sum >/dev/null; then
            sha256sum "$archive" > "${archive}.sha256"
          else
            shasum -a 256 "$archive" > "${archive}.sha256"
          fi
          mkdir release
          mv "$archive" "${archive}.sha256" release/
          cp "target/$TARGET/release/notaryctl${suffix}" "release/notaryctl-${ASSET}${suffix}"
          cp "target/$TARGET/release/notaryd${suffix}" "release/notaryd-${ASSET}${suffix}"
          if command -v sha256sum >/dev/null; then
            (cd release && sha256sum "notaryctl-${ASSET}${suffix}" > "notaryctl-${ASSET}${suffix}.sha256")
            (cd release && sha256sum "notaryd-${ASSET}${suffix}" > "notaryd-${ASSET}${suffix}.sha256")
          else
            (cd release && shasum -a 256 "notaryctl-${ASSET}${suffix}" > "notaryctl-${ASSET}${suffix}.sha256")
            (cd release && shasum -a 256 "notaryd-${ASSET}${suffix}" > "notaryd-${ASSET}${suffix}.sha256")
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: cli-${{ matrix.asset }}
          path: release/*
          if-no-files-found: error
          retention-days: 1

  desktop:
    needs: prepare
    uses: ./.github/workflows/desktop-dmg.yml
    with:
      sign: true
      source_ref: ${{ needs.prepare.outputs.private_tag }}
      build_id: ${{ needs.prepare.outputs.build_id }}
      public_origin: ${{ vars.NOTARY_PUBLIC_ORIGIN || 'https://notary.exalto.ai' }}
      updates_enabled: true
    secrets: inherit

  manifest:
    name: Sign release manifest
    needs: [prepare, build, desktop]
    runs-on: ubuntu-24.04
    environment: macos-release
    env:
      BUILD_ID: ${{ needs.prepare.outputs.build_id }}
      CHANNEL: latest
      PUBLIC_ORIGIN: ${{ vars.NOTARY_PUBLIC_ORIGIN || 'https://notary.exalto.ai' }}
      PUBLIC_SHA: ${{ needs.prepare.outputs.public_sha }}
      RELEASE_SHA: ${{ needs.prepare.outputs.release_sha }}
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare.outputs.private_tag }}
      - name: Verify release source
        run: |
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
          node scripts/runtime-version.mjs --check "$VERSION"
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/notary-app/package-lock.json
      - uses: actions/download-artifact@v8
        with:
          path: release
          merge-multiple: true
      - run: npm --prefix apps/notary-app ci
      - name: Allocate the next authenticated latest revision
        id: channel
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends minisign
          channel_url="$PUBLIC_ORIGIN/downloads/releases/channels/latest.json"
          status="$(curl --silent --show-error --location \
            --retry 3 --retry-all-errors --connect-timeout 5 --max-time 20 \
            --output "$RUNNER_TEMP/current-channel.json" \
            --write-out '%{http_code}' "$channel_url")"
          if test "$status" = 404; then
            revision=1
          elif test "$status" = 200; then
            test "$(jq -r .schema_version "$RUNNER_TEMP/current-channel.json")" = \
              notary/release-channel-envelope/v1
            jq -er .signed "$RUNNER_TEMP/current-channel.json" \
              | base64 --decode > "$RUNNER_TEMP/current-channel.payload.json"
            jq -er .signature "$RUNNER_TEMP/current-channel.json" \
              | base64 --decode > "$RUNNER_TEMP/current-channel.minisig"
            base64 --decode runtime/config/updater-public-key.txt > "$RUNNER_TEMP/updater.pub"
            minisign -Vm "$RUNNER_TEMP/current-channel.payload.json" \
              -p "$RUNNER_TEMP/updater.pub" -x "$RUNNER_TEMP/current-channel.minisig"
            test "$(jq -r .schema_version "$RUNNER_TEMP/current-channel.payload.json")" = \
              notary/release-channel/v1
            test "$(jq -r .channel "$RUNNER_TEMP/current-channel.payload.json")" = latest
            current="$(jq -er '.channel_revision | select(type == "number" and floor == . and . > 0)' \
              "$RUNNER_TEMP/current-channel.payload.json")"
            revision="$((current + 1))"
          else
            echo "could not read the current latest channel: HTTP $status" >&2
            exit 1
          fi
          test "$revision" -le 9007199254740991
          echo "revision=$revision" >> "$GITHUB_OUTPUT"
      - name: Generate and sign immutable release manifest and latest pointer
        env:
          CHANNEL_REVISION: ${{ steps.channel.outputs.revision }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          node scripts/release-manifest.mjs \
            --release-dir release \
            --build-id "$BUILD_ID" \
            --commit-sha "$RELEASE_SHA" \
            --public-source-sha "$PUBLIC_SHA" \
            --version "$VERSION" \
            --published-at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --public-origin "$PUBLIC_ORIGIN" \
            --output release/release.json
          npm --prefix apps/notary-app exec -- tauri signer sign "$(pwd)/release/release.json"
          test -s release/release.json.sig
          base64 --decode runtime/config/updater-public-key.txt > "$RUNNER_TEMP/updater.pub"
          base64 --decode release/release.json.sig > "$RUNNER_TEMP/release.minisig"
          minisign -Vm release/release.json \
            -p "$RUNNER_TEMP/updater.pub" -x "$RUNNER_TEMP/release.minisig"
          (cd release && sha256sum release.json > release.json.sha256)
          node scripts/release-manifest.mjs \
            --channel latest \
            --revision "$CHANNEL_REVISION" \
            --manifest release/release.json \
            --manifest-url "$PUBLIC_ORIGIN/downloads/releases/builds/$BUILD_ID/release.json" \
            --signature release/release.json.sig \
            --output release/channel.payload.json
          npm --prefix apps/notary-app exec -- tauri signer sign "$(pwd)/release/channel.payload.json"
          test -s release/channel.payload.json.sig
          base64 --decode release/channel.payload.json.sig > "$RUNNER_TEMP/channel.minisig"
          minisign -Vm release/channel.payload.json \
            -p "$RUNNER_TEMP/updater.pub" -x "$RUNNER_TEMP/channel.minisig"
          node scripts/release-manifest.mjs \
            --envelope 1 \
            --payload release/channel.payload.json \
            --signature release/channel.payload.json.sig \
            --output release/channel.json
      - uses: actions/upload-artifact@v7
        with:
          name: client-release-manifest
          path: |
            release/release.json
            release/release.json.sig
            release/release.json.sha256
            release/channel.json
          if-no-files-found: error
          retention-days: 3

  publish:
    name: Publish latest
    needs: [prepare, build, desktop, manifest]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: production
    env:
      AWS_DEFAULT_REGION: auto
      AWS_EC2_METADATA_DISABLED: true
      AWS_MAX_ATTEMPTS: 10
      AWS_RETRY_MODE: standard
      BUCKET: notary-prod-downloads
      BUILD_ID: ${{ needs.prepare.outputs.build_id }}
      ENDPOINT: https://t3.storage.dev
      GH_TOKEN: ${{ secrets.NOTARY_RELEASE_TOKEN }}
      PRIVATE_TAG: ${{ needs.prepare.outputs.private_tag }}
      PUBLIC_BUCKET_ORIGIN: https://notary-prod-downloads.t3.tigrisfiles.io
      PUBLIC_SHA: ${{ needs.prepare.outputs.public_sha }}
      PUBLIC_TAG: ${{ needs.prepare.outputs.public_tag }}
      RELEASE_SHA: ${{ needs.prepare.outputs.release_sha }}
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare.outputs.private_tag }}
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - uses: actions/download-artifact@v8
        with:
          path: release
          merge-multiple: true
      - name: Validate complete release set
        id: release
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
          node scripts/runtime-version.mjs --check "$VERSION"
          for asset in \
            "notary-runtime-${VERSION}-linux-x86_64.tar.gz" \
            "notary-runtime-${VERSION}-linux-aarch64.tar.gz" \
            "notary-runtime-${VERSION}-darwin-aarch64.tar.gz" \
            "notary-runtime-${VERSION}-windows-x86_64.zip" \
            "Notary-macos-arm64.dmg" \
            "Notary-macos-arm64.app.tar.gz" \
            "notaryctl-linux-x86_64" \
            "notaryd-linux-x86_64" \
            "notaryctl-linux-aarch64" \
            "notaryd-linux-aarch64" \
            "notaryctl-darwin-aarch64" \
            "notaryd-darwin-aarch64" \
            "notaryctl-windows-x86_64.exe" \
            "notaryd-windows-x86_64.exe" \
            "release.json"; do
            test -f "release/$asset"
            test -f "release/$asset.sha256"
            (cd release && sha256sum --check "$asset.sha256")
          done
          test -s release/Notary-macos-arm64.app.tar.gz.sig
          test -s release/release.json.sig
          test -s release/channel.json
          test "$(jq -r .schema_version release/release.json)" = notary/release/v2
          test "$(jq -r .build_id release/release.json)" = "$BUILD_ID"
          test "$(jq -r .commit_sha release/release.json)" = "$RELEASE_SHA"
          test "$(jq -r .public_source_sha release/release.json)" = "$PUBLIC_SHA"
          test "$(jq -r .version release/release.json)" = "$VERSION"
          test "$(jq -r .schema_version release/channel.json)" = \
            notary/release-channel-envelope/v1
          prefix="releases/builds/$BUILD_ID"
          echo "prefix=$prefix" >> "$GITHUB_OUTPUT"
      - name: Upload immutable build
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.NOTARY_DOWNLOADS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.NOTARY_DOWNLOADS_SECRET_ACCESS_KEY }}
          PREFIX: ${{ steps.release.outputs.prefix }}
        run: |
          set -euo pipefail
          aws configure set default.s3.preferred_transfer_client classic
          aws configure set default.s3.multipart_threshold 1GB
          for file in release/*; do
            name="${file#release/}"
            case "$name" in
              *.tar.gz) content_type=application/gzip ;;
              *.zip) content_type=application/zip ;;
              *.dmg) content_type=application/x-apple-diskimage ;;
              *.sha256) content_type='text/plain; charset=utf-8' ;;
              *.sig) content_type='text/plain; charset=utf-8' ;;
              *.json) content_type='application/json; charset=utf-8' ;;
              notaryctl-*|notaryd-*) content_type=application/octet-stream ;;
              *) echo "unexpected release file: $name" >&2; exit 1 ;;
            esac
            uploaded=false
            for attempt in 1 2 3 4 5; do
              if aws s3 cp "$file" "s3://$BUCKET/$PREFIX/$name" \
                --endpoint-url "$ENDPOINT" \
                --cache-control 'public, max-age=31536000, immutable' \
                --content-type "$content_type" \
                --only-show-errors; then
                uploaded=true
                break
              fi
              echo "upload attempt $attempt failed for $name" >&2
              if test "$attempt" -lt 5; then sleep "$((attempt * 5))"; fi
            done
            test "$uploaded" = true
          done
      - name: Verify public immutable build
        env:
          PREFIX: ${{ steps.release.outputs.prefix }}
        run: |
          set -euo pipefail
          mkdir "$RUNNER_TEMP/public-release"
          for checksum in release/*.sha256; do
            checksum_name="${checksum#release/}"
            archive_name="${checksum_name%.sha256}"
            curl --fail --silent --show-error --location \
              --retry 8 --retry-all-errors --retry-delay 2 \
              "$PUBLIC_BUCKET_ORIGIN/$PREFIX/$archive_name" \
              -o "$RUNNER_TEMP/public-release/$archive_name"
            curl --fail --silent --show-error --location \
              --retry 8 --retry-all-errors --retry-delay 2 \
              "$PUBLIC_BUCKET_ORIGIN/$PREFIX/$checksum_name" \
              -o "$RUNNER_TEMP/public-release/$checksum_name"
            (cd "$RUNNER_TEMP/public-release" && sha256sum --check "$checksum_name")
          done
          for signature in release/*.sig; do
            signature_name="${signature#release/}"
            curl --fail --silent --show-error --location \
              --retry 8 --retry-all-errors --retry-delay 2 \
              "$PUBLIC_BUCKET_ORIGIN/$PREFIX/$signature_name" \
              -o "$RUNNER_TEMP/public-release/$signature_name"
            cmp "$signature" "$RUNNER_TEMP/public-release/$signature_name"
          done
          curl --fail --silent --show-error --location \
            --retry 8 --retry-all-errors --retry-delay 2 \
            "$PUBLIC_BUCKET_ORIGIN/$PREFIX/channel.json" \
            -o "$RUNNER_TEMP/public-release/channel.json"
          cmp release/channel.json "$RUNNER_TEMP/public-release/channel.json"
          if ! command -v minisign >/dev/null 2>&1; then
            sudo apt-get \
              -o Acquire::Retries=2 \
              -o Acquire::http::Timeout=15 \
              -o Acquire::https::Timeout=15 \
              install --yes --no-install-recommends minisign
          fi
          base64 --decode runtime/config/updater-public-key.txt > "$RUNNER_TEMP/updater.pub"
          base64 --decode "$RUNNER_TEMP/public-release/release.json.sig" > "$RUNNER_TEMP/release.minisig"
          minisign -Vm "$RUNNER_TEMP/public-release/release.json" \
            -p "$RUNNER_TEMP/updater.pub" -x "$RUNNER_TEMP/release.minisig"
          base64 --decode "$RUNNER_TEMP/public-release/Notary-macos-arm64.app.tar.gz.sig" \
            > "$RUNNER_TEMP/desktop.minisig"
          minisign -Vm "$RUNNER_TEMP/public-release/Notary-macos-arm64.app.tar.gz" \
            -p "$RUNNER_TEMP/updater.pub" -x "$RUNNER_TEMP/desktop.minisig"
          jq -r .signed "$RUNNER_TEMP/public-release/channel.json" \
            | base64 --decode > "$RUNNER_TEMP/channel.payload.json"
          jq -r .signature "$RUNNER_TEMP/public-release/channel.json" \
            | base64 --decode > "$RUNNER_TEMP/channel.minisig"
          minisign -Vm "$RUNNER_TEMP/channel.payload.json" \
            -p "$RUNNER_TEMP/updater.pub" -x "$RUNNER_TEMP/channel.minisig"
          test "$(jq -r .build_id "$RUNNER_TEMP/channel.payload.json")" = "$BUILD_ID"
      - name: Move latest pointer
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.NOTARY_DOWNLOADS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.NOTARY_DOWNLOADS_SECRET_ACCESS_KEY }}
          PREFIX: ${{ steps.release.outputs.prefix }}
        run: |
          set -euo pipefail
          printf '%s %s\n' "$BUILD_ID" "$VERSION" > "$RUNNER_TEMP/current"
          cp release/channel.json "$RUNNER_TEMP/channel.json"
          aws s3 cp "$RUNNER_TEMP/current" "s3://$BUCKET/releases/latest" \
            --endpoint-url "$ENDPOINT" \
            --cache-control 'no-store' \
            --content-type 'text/plain; charset=utf-8' \
            --only-show-errors
          aws s3 cp "$RUNNER_TEMP/channel.json" "s3://$BUCKET/releases/channels/latest.json" \
            --endpoint-url "$ENDPOINT" \
            --cache-control 'no-store' \
            --content-type 'application/json; charset=utf-8' \
            --only-show-errors
          expected="$(cat "$RUNNER_TEMP/current")"
          actual="$(curl --fail --silent --show-error --location \
            --retry 30 --retry-all-errors --retry-delay 2 --retry-max-time 90 \
            "$PUBLIC_BUCKET_ORIGIN/releases/latest")"
          test "$actual" = "$expected"
          curl --fail --silent --show-error --location \
            --retry 30 --retry-all-errors --retry-delay 2 --retry-max-time 90 \
            "$PUBLIC_BUCKET_ORIGIN/releases/channels/latest.json" \
            -o "$RUNNER_TEMP/published-channel.json"
          cmp "$RUNNER_TEMP/channel.json" "$RUNNER_TEMP/published-channel.json"
          website="$(curl --fail --silent --show-error --location \
            --retry 30 --retry-all-errors --retry-delay 2 --retry-max-time 90 \
            https://notary.exalto.ai/downloads/releases/latest)"
          test "$website" = "$expected"
          curl --fail --silent --show-error --location \
            --retry 30 --retry-all-errors --retry-delay 2 --retry-max-time 90 \
            https://notary.exalto.ai/downloads/releases/channels/latest.json \
            -o "$RUNNER_TEMP/website-channel.json"
          cmp "$RUNNER_TEMP/channel.json" "$RUNNER_TEMP/website-channel.json"
      - name: Publish public source release
        run: |
          set -euo pipefail
          reference="$(gh api "repos/exalto-ai/notary-runtime/git/ref/tags/$PUBLIC_TAG")"
          target_type="$(jq -r .object.type <<<"$reference")"
          target="$(jq -r .object.sha <<<"$reference")"
          if test "$target_type" = tag; then
            target="$(gh api "repos/exalto-ai/notary-runtime/git/tags/$target" --jq .object.sha)"
          elif test "$target_type" != commit; then
            echo "public tag has unsupported target type $target_type" >&2
            exit 1
          fi
          test "$target" = "$PUBLIC_SHA"
          if gh release view "$PUBLIC_TAG" --repo exalto-ai/notary-runtime >/dev/null 2>&1; then
            echo "public GitHub Release $PUBLIC_TAG already exists"
          else
            notes="$(printf '%s\n\n%s\n%s\n%s\n' \
              "Stable Notary Runtime $VERSION." \
              "Private source: $GITHUB_REPOSITORY@$RELEASE_SHA ($PRIVATE_TAG)" \
              "Public source: exalto-ai/notary-runtime@$PUBLIC_SHA ($PUBLIC_TAG)" \
              "Immutable build: $BUILD_ID")"
            gh release create "$PUBLIC_TAG" \
              --repo exalto-ai/notary-runtime \
              --verify-tag \
              --title "Notary Runtime v$VERSION" \
              --notes "$notes"
          fi
          {
            echo "### Published Notary Runtime v$VERSION"
            echo
            echo "- Channel: \`latest\`"
            echo "- Private: \`$PRIVATE_TAG\` at \`$RELEASE_SHA\`"
            echo "- Public: \`$PUBLIC_TAG\` at \`$PUBLIC_SHA\`"
            echo "- Build: \`$BUILD_ID\`"
          } >> "$GITHUB_STEP_SUMMARY"
